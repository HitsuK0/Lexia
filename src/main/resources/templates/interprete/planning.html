<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head th:replace="~{common/head :: head('Mon Planning', '/css/interprete/planning.css')}"></head>

    <body>
        <nav th:replace="~{common/navbar :: navbar(activeTab='planning', userRole='INTERPRETER', userName='Jean Dupont', breadcrumb=null, isAdmin=null)}"></nav>

        <div class="container-fluid py-2 px-5">

            <div class="text-center mb-2">
                <h1 class="fw-bold text-primary">Votre horaire de la semaine</h1>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-2  px-5">

                <div class="btn-group">
                    <a th:href="@{/interprete/planning}" class="btn btn-primary btn-sm">Mon Planning</a>
                    <a th:href="@{/interprete/planning/beneficiaires}" class="btn btn-outline-primary btn-sm">Mes Bénéficiaires</a>
                </div>

                <div class="d-flex gap-3 small text-muted">
                    <span><span class="badge" style="background-color:#f0ad4e;">&nbsp;&nbsp;</span> Indisponibilité</span>
                    <span><span class="badge" style="background-color:#f28b82;">&nbsp;&nbsp;</span> Annulée</span>
                    <span><span class="badge" style="background-color:#b39ddb;">&nbsp;&nbsp;</span> Horaire de base</span>
                </div>

                <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalIndispo">
                    <i class="bi bi-calendar-plus"></i> Déclarer une indisponibilité
                </button>
            </div>

            <div id="calendar"></div>
        </div>

        <div class="modal fade" id="modalIndispo" tabindex="-1" aria-labelledby="modalIndispoLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-header border-bottom">
                        <h5 class="modal-title fw-bold w-100 text-center" id="modalIndispoLabel">Déclarer une indisponibilité</h5>
                        <button type="button" class="btn-close position-absolute end-0 me-3" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body px-4 py-3">

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label small fw-semibold">Date début</label>
                                <input type="date" id="dateStart" class="form-control form-control-sm"
                                       placeholder="Choisissez une date"/>
                            </div>
                            <div class="col">
                                <label class="form-label small fw-semibold">Date end</label>
                                <input type="date" id="dateEnd" class="form-control form-control-sm"
                                       placeholder="Choisissez une date"/>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Plage Horaire</label>
                            <div class="d-flex gap-2" id="plageHoraire">
                                <select id="startHour" class="form-select form-select-sm" size="5"></select>
                                <select id="endHour" class="form-select form-select-sm" size="5"></select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="fullDay"/>
                                <label class="form-check-label small" for="fullDay">Journée complète</label>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Motif <span class="text-muted fw-normal">(facultatif)</span></label>
                            <textarea id="motif" class="form-control form-control-sm" rows="3" placeholder="Texte ..."></textarea>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="motifPrive"/>
                            <label class="form-check-label small" for="motifPrive">Rendre le motif privé</label>
                        </div>
                        <div class="text-muted" style="font-size: 0.78rem; margin-left: 1.5rem;">
                            Seule la coordinatrice pourra voir le motif
                        </div>
                    </div>

                    <div class="modal-footer border-top justify-content-center gap-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
                        <button type="button" class="btn btn-primary btn-sm" id="btnSend">Envoyez la demande</button>
                    </div>

                </div>
            </div>
        </div>

        <script th:src="@{/js/fullcalendar.min.js}"></script>

        <script>
            document.addEventListener('DOMContentLoaded', function () {

                const events = [
                    {
                        title: 'Mathématiques\nTranscription\nBénéficiaire : V.Jean\nLocal M5',
                        start: '2026-03-02T08:30:00',
                        end: '2026-03-02T10:30:00',
                        color: '#b39ddb'
                    },
                    {
                        title: 'Annulé – Anglais\nTranscription\nBénéficiaire : V.Jean\nLocal A2',
                        start: '2026-03-02T11:00:00',
                        end: '2026-03-02T13:00:00',
                        color: '#f28b82'
                    },
                    {
                        title: 'Cours\nCompétence métier\nBénéficiaire : N.Prenom\nLocal nºX',
                        start: '2026-03-02T14:00:00',
                        end: '2026-03-02T15:30:00',
                        color: '#b39ddb'
                    },
                    {
                        title: 'Histoire\nTranscription\nBénéficiaire : N.Jean-François',
                        start: '2026-03-03T10:00:00',
                        end: '2026-03-03T11:00:00',
                        color: '#b39ddb'
                    },
                    {
                        title: 'Indisponibilité\nRaison : XX',
                        start: '2026-03-04T14:00:00',
                        end: '2026-03-04T16:00:00',
                        color: '#f0ad4e'
                    },
                    {
                        title: 'Sciences\nTranslittération\nBénéficiaire : D.Ryan\nLabo scientifique Nº2',
                        start: '2026-03-05T14:30:00',
                        end: '2026-03-05T16:30:00',
                        color: '#b39ddb'
                    },
                    {
                        title: 'Indisponibilité\nRdv médical',
                        start: '2026-03-06T08:30:00',
                        end: '2026-03-06T12:30:00',
                        color: '#f0ad4e'
                    }
                ];

                const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                    locale: 'fr',
                    initialView: 'timeGridWeek',
                    initialDate: '2026-03-02',
                    headerToolbar: {
                        left: 'prev',
                        center: 'title',
                        right: 'next'
                    },
                    slotMinTime: '08:00:00',
                    slotMaxTime: '19:00:00',
                    allDaySlot: false,

                    <!-- Function that allows you to click on a blank range and this opens the associated modal -->
                    dateClick: function (info) {
                        document.getElementById('dateStart').value = info.dateStr.split('T')[0];
                        document.getElementById('dateEnd').value = info.dateStr.split('T')[0];

                        if (info.dateStr.includes('T')) {
                            const heureStr = info.dateStr.split('T')[1].substring(0, 5);
                            const [h, m] = heureStr.split(':').map(Number);
                            const minutesArrondies = m < 30 ? 0 : 30;
                            const totalMinutes = h * 60 + minutesArrondies;
                            const heureArrondie = `${String(h).padStart(2, '0')}:${minutesArrondies === 0 ? '00' : '30'}`;

                            generateHours('endHour', totalMinutes + 30, 19 * 60);
                            document.getElementById('startHour').value = heureArrondie;
                        }

                        const modal = new bootstrap.Modal(document.getElementById('modalIndispo'));
                        modal.show();
                    },

                    height: 'calc(100vh - 170px)',
                    events: events,

                    <!-- Allows you to set the icon according to the status of the appointment -->
                    eventContent: function (arg) {
                        const lines = arg.event.title.split('\n');
                        const isAnnule = lines[0].startsWith('Annulé');
                        const isIndispo = lines[0].startsWith('Indisponibilité');

                        const icone = isAnnule
                            ? '<i class="bi bi-x-circle" style="float:right; font-size:0.85rem;"></i>'
                            : isIndispo
                                ? '<i class="bi bi-slash-circle" style="float:right; font-size:0.85rem;"></i>'
                                : '';

                        const html = lines.map((l, i) =>
                            `<div class="${i === 0 ? 'fw-bold' : 'small'}">${l}</div>`
                        ).join('');

                        return {html: `<div class="p-1">${icone}${html}</div>`};
                    }
                });

                calendar.render();

                function generateHours(selectId, start, end) {
                    const select = document.getElementById(selectId);
                    select.innerHTML = '<option value="" disabled selected>-- Heure --</option>';
                    for (let t = start; t <= end; t += 5) {
                        const hh = String(Math.floor(t / 60)).padStart(2, '0');
                        const mm = String(t % 60).padStart(2, '0');
                        const option = document.createElement('option');
                        option.value = `${hh}:${mm}`;
                        option.textContent = `${hh}:${mm}`;
                        select.appendChild(option);
                    }
                }

                generateHours('startHour', 8 * 60, 18 * 60 + 55);
                generateHours('endHour', 8 * 60 + 5, 19 * 60);

                document.getElementById('startHour').addEventListener('change', function () {
                    const [h, m] = this.value.split(':').map(Number);
                    const totalMinutes = h * 60 + m;
                    generateHours('endHour', totalMinutes + 5, 19 * 60);
                });

                document.getElementById('fullDay').addEventListener('change', function () {
                    document.getElementById('startHour').disabled = this.checked;
                    document.getElementById('endHour').disabled = this.checked;
                });

                document.getElementById('btnSend').addEventListener('click', function () {
                    let valid = true;

                    const dateStart = document.getElementById('dateStart');
                    const dateEnd = document.getElementById('dateEnd');
                    const startHour = document.getElementById('startHour');
                    const endHour = document.getElementById('endHour');
                    const fullDay = document.getElementById('fullDay').checked;

                    [dateStart, dateEnd, startHour, endHour].forEach(el => {
                        el.classList.remove('is-invalid');
                        const feedback = el.nextElementSibling;
                        if (feedback && feedback.classList.contains('invalid-feedback')) {
                            feedback.remove();
                        }
                    });

                    function displayError(input, message) {
                        input.classList.add('is-invalid');
                        const div = document.createElement('div');
                        div.classList.add('invalid-feedback');
                        div.textContent = message;
                        input.insertAdjacentElement('afterend', div);
                        valid = false;
                    }

                    if (!dateStart.value) displayError(dateStart, 'La date de début est obligatoire.');
                    if (!dateEnd.value) displayError(dateEnd, 'La date de end est obligatoire.');
                    if (dateStart.value && dateEnd.value && dateEnd.value < dateStart.value) {
                        displayError(dateEnd, 'La date de end doit être après la date de début.');
                    }

                    if (!fullDay) {
                        if (!startHour.value) displayError(startHour, 'L\'heure de début est obligatoire.');
                        if (!endHour.value) displayError(endHour, 'L\'heure de end est obligatoire.');
                    }

                    if (!valid) return;

                    bootstrap.Modal.getInstance(document.getElementById('modalIndispo')).hide();
                });
            });
        </script>

        <div th:replace="~{common/footer :: footer}"></div>
    </body>
</html>
