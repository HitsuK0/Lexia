<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

    <head th:replace="~{common/head :: head('Mon Planning', '/css/interprete/planning.css')}"></head>

    <body>
        <nav th:replace="~{common/navbar :: navbar(activeTab='planning', userRole=${userRole}, userName=${userName}, breadcrumb=null, isAdmin=${isAdmin})}"></nav>

        <div class="container-fluid py-2 px-2 px-md-5">

            <div class="text-center mb-2">
                <h1 class="fw-bold text-primary">Votre horaire de la semaine</h1>
            </div>

            <div id="planning-toolbar" class="mb-2 px-2 px-md-5">
                <div class="d-flex justify-content-between align-items-center gap-2">
                    <div class="btn-group" id="btnGroupPlanning">
                        <a th:href="@{/interprete/planning}" class="btn btn-primary btn-sm">Mon Planning</a>
                        <a th:href="@{/interprete/planning/beneficiaires}" class="btn btn-outline-primary btn-sm">Mes Bénéficiaires</a>
                    </div>

                    <div class="d-none d-lg-flex gap-3 small text-muted">
                        <span><span class="badge" style="background-color:#f0ad4e;">&nbsp;<i class="bi bi-slash-circle" style="font-size:0.7rem;"></i>&nbsp;</span> Indisponibilité</span>
                        <span><span class="badge" style="background-color:#f28b82;">&nbsp;<i class="bi bi-x-circle" style="font-size:0.7rem;"></i>&nbsp;</span> Annulée</span>
                        <span><span class="badge" style="background-color:#b39ddb;">&nbsp;&nbsp;</span> Horaire de base</span>
                    </div>

                    <button type="button" class="btn btn-primary btn-sm d-none d-lg-block"
                            data-bs-toggle="modal" data-bs-target="#modalIndispo">
                        <i class="bi bi-calendar-plus"></i> Déclarer une indisponibilité
                    </button>
                </div>

                <div class="d-lg-none mt-2">
                    <button type="button" class="btn btn-primary btn-sm w-100"
                            data-bs-toggle="modal" data-bs-target="#modalIndispo">
                        <i class="bi bi-calendar-plus"></i> Déclarer une indisponibilité
                    </button>
                </div>

            </div>

            <div id="calendar"></div>
        </div>

        <div class="modal fade" id="modalIndispo" tabindex="-1" aria-labelledby="modalIndispoLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-header border-bottom">
                        <h5 class="modal-title fw-bold w-100 text-center" id="modalIndispoLabel">Déclarer une indisponibilité</h5>
                        <button type="button" class="btn-close position-absolute end-0 me-3" data-bs-dismiss="modal"></button>
                    </div>

                    <form method="post" th:object="${DTOAbsence}" th:action="@{/interprete/indisponibilites}">
                        <div class="modal-body px-4 py-3">
                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label small fw-semibold">Date début</label>
                                    <input type="date" th:field="*{startDate}" id="dateStart" class="form-control form-control-sm"
                                           placeholder="Choisissez une date"/>
                                </div>
                                <div class="col">
                                    <label class="form-label small fw-semibold">Date end</label>
                                    <input type="date" th:field="*{endDate}" id="dateEnd" class="form-control form-control-sm"
                                           placeholder="Choisissez une date"/>
                                </div>
                            </div>

                            <div class="mb-2">
                                <label class="form-label small fw-semibold">Plage Horaire</label>
                                <div class="d-flex gap-2" id="plageHoraire">
                                    <select id="startHour" th:field="*{startTime}" class="form-select form-select-sm" size="5"></select>
                                    <select id="endHour" th:field="*{endTime}" class="form-select form-select-sm" size="5"></select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" th:field="*{fullDay}" type="checkbox" id="fullDay"/>
                                    <label class="form-check-label small" for="fullDay">Journée complète</label>
                                </div>
                            </div>

                            <div class="mb-2">
                                <label class="form-label small fw-semibold">Motif <span class="text-muted fw-normal">(facultatif)</span></label>
                                <textarea th:field="*{reason}" id="motif" class="form-control form-control-sm" rows="3" placeholder="Texte ..."></textarea>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" th:field="*{privateReason}" type="checkbox" id="motifPrive"/>
                                <label class="form-check-label small" for="motifPrive">Rendre le motif privé</label>
                            </div>
                            <div class="text-muted" style="font-size: 0.78rem; margin-left: 1.5rem;">
                                Seule la coordinatrice pourra voir le motif
                            </div>
                        </div>

                        <div class="modal-footer border-top justify-content-center gap-2">
                            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
                            <button type="button" class="btn btn-primary btn-sm" id="btnSendPlanning">Envoyez la demande</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalEvent" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="modalEventTitle"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="modalEventBody"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Fermer</button>
                    </div>
                </div>
            </div>
        </div>

        <script th:src="@{/js/fullcalendar.min.js}"></script>
        <script th:src="@{/js/interprete/planning.js}"></script>

        <div class="d-flex d-lg-none gap-2 small text-muted flex-wrap justify-content-center mt-3 mb-2 px-3">
            <span><span class="badge" style="background-color:#f0ad4e;">&nbsp;<i class="bi bi-slash-circle" style="font-size:0.7rem;"></i>&nbsp;</span> Indisponibilité</span>
            <span><span class="badge" style="background-color:#f28b82;">&nbsp;<i class="bi bi-x-circle" style="font-size:0.7rem;"></i>&nbsp;</span> Annulée</span>
            <span><span class="badge" style="background-color:#b39ddb;">&nbsp;&nbsp;</span> Horaire de base</span>
        </div>

        <div th:replace="~{common/footer :: footer}"></div>
    </body>
</html>
