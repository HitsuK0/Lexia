<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

    <head th:replace="~{common/head :: head('Gestion Utilisateurs', '/css/coordinatrice/utilisateurs.css')}"></head>

    <body>
        <nav th:replace="~{common/navbar :: navbar(activeTab='utilisateurs', userRole='COORDINATOR', userName=${userName}, breadcrumb='Gestion Utilisateurs', isAdmin=true)}"></nav>

        <div class="container-fluid px-5 py-4">

            <div class="text-center mb-3">
                <h1 class="fw-bold text-primary mb-0">Liste des utilisateurs</h1>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-2 px-5">
                <div class="d-flex gap-2" style="max-width: 590px;">
                    <div class="input-group">
                                <span class="input-group-text border-end-0">
                                    <i class="bi bi-search text-muted"></i>
                                </span>
                        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Rechercher un utilisateur..."/>
                    </div>
                    <select id="roleFilter" class="form-select" style="max-width: 160px; min-width: 160px;">
                        <option value="" selected>Tous les rôles</option>
                        <option value="coordinatrice">Coordinatrice</option>
                        <option value="resa">Résa</option>
                        <option value="interprete">Interprète</option>
                        <option value="beneficiaire">Bénéficiaire</option>
                    </select>
                </div>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAjout">
                    <i class="bi bi-person-plus me-1"></i> Ajouter un utilisateur
                </button>
            </div>

            <div class="px-5">
                <div class="table-wrapper">
                    <table class="table table-hover table-utilisateurs">
                        <thead>
                        <tr>
                            <th>Nom et Prénom</th>
                            <th>Rôle</th>
                            <th>Email</th>
                            <th>Téléphone</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="tableBody">
                        <tr th:each="user : ${resas}" data-role="resa">
                            <td th:text="${user.lastName} + ' ' + ${user.firstName}"></td>
                            <td><span class="badge-role resa">Résa</span></td>
                            <td th:text="${user.emailAddress}"></td>
                            <td th:text="${user.phoneNumber}"></td>
                            <td>
                                <a th:href="@{/coordinatrice/utilisateurs/interpreter/{id}(id=${user.numUser})}" class="btn btn-link p-0 text-dark me-2" title="Modifier">
                                    <i class="bi bi-pencil-square fs-5"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:each="user : ${interpreters}" data-role="interprete">
                            <td th:text="${user.lastName} + ' ' + ${user.firstName}"></td>
                            <td><span class="badge-role interprete">Interprète</span></td>
                            <td th:text="${user.emailAddress}"></td>
                            <td th:text="${user.phoneNumber}"></td>
                            <td>
                                <a th:href="@{/coordinatrice/utilisateurs/interpreter/{id}(id=${user.numUser})}" class="btn btn-link p-0 text-dark me-2" title="Modifier">
                                    <i class="bi bi-pencil-square fs-5"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:each="user : ${beneficiaries}" data-role="beneficiaire">
                            <td th:text="${user.lastName} + ' ' + ${user.firstName}"></td>
                            <td><span class="badge-role beneficiaire">Bénéficiaire</span></td>
                            <td th:text="${user.emailAddress}"></td>
                            <td th:text="${user.phoneNumber}"></td>
                            <td>
                                <a th:href="@{/coordinatrice/utilisateurs/beneficiary/{id}(id=${user.numUser})}" class="btn btn-link p-0 text-dark me-2" title="Modifier">
                                    <i class="bi bi-pencil-square fs-5"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:each="user : ${coordinators}" data-role="coordinatrice">
                            <td th:text="${user.lastName} + ' ' + ${user.firstName}"></td>
                            <td><span class="badge-role coordinatrice">Coordinatrice</span></td>
                            <td th:text="${user.emailAddress}"></td>
                            <td th:text="${user.phoneNumber}"></td>
                            <td>
                                <a th:href="@{/coordinatrice/utilisateurs/interpreter/{id}(id=${user.numUser})}" class="btn btn-link p-0 text-dark me-2" title="Modifier">
                                    <i class="bi bi-pencil-square fs-5"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <nav class="mt-4 d-flex justify-content-center" aria-label="Pagination utilisateurs">
                <ul class="pagination" id="pagination"></ul>
            </nav>

            <hr class="my-4"/>
            <div class="row g-3 justify-content-center mb-4">
                <div class="col-md-2">
                    <div class="stat-card text-center p-3">
                        <i class="bi bi-people fs-3 text-muted mb-2 d-block"></i>
                        <div class="fw-bold fs-4" th:text="${numberUsers}">77</div>
                        <div class="text-muted small">Utilisateurs Total</div>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="stat-card text-center p-3">
                        <i class="bi bi-person fs-3 text-muted mb-2 d-block"></i>
                        <div class="fw-bold fs-4" th:text="${numberInterpreters}">25</div>
                        <div class="text-muted small">Interprètes</div>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="stat-card text-center p-3">
                        <i class="bi bi-person fs-3 text-muted mb-2 d-block"></i>
                        <div class="fw-bold fs-4" th:text="${numberBeneficiaries}">50</div>
                        <div class="text-muted small">Bénéficiaires</div>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="stat-card text-center p-3">
                        <i class="bi bi-person fs-3 text-muted mb-2 d-block"></i>
                        <div class="fw-bold fs-4" th:text="${numberResas}">2</div>
                        <div class="text-muted small">Resas</div>
                    </div>
                </div>
            </div>

        </div>

        <div class="modal fade" id="modalAjout" tabindex="-1" aria-labelledby="modalAjoutLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header border-bottom">
                        <h5 class="modal-title fw-bold w-100 text-center" id="modalAjoutLabel">Ajouter un utilisateur</h5>
                        <button type="button" class="btn-close position-absolute end-0 me-3" data-bs-dismiss="modal"></button>
                    </div>
                    <form method="post" th:action="@{/coordinatrice/utilisateurs/addUser}" th:object="${dtoAddUser}">
                        <div class="modal-body px-4 py-3">
                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label small fw-semibold">Nom</label>
                                    <input type="text" th:field="*{lastName}" class="form-control form-control-sm" placeholder="Ex : DUBOIS"/>
                                </div>
                                <div class="col">
                                    <label class="form-label small fw-semibold">Prénom</label>
                                    <input type="text" th:field="*{firstName}" class="form-control form-control-sm" placeholder="Ex : Lucie"/>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Email</label>
                                <input type="email" th:field="*{emailAddress}" class="form-control form-control-sm" placeholder="Ex : lucie.dubois@mail.com"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Téléphone</label>
                                <input type="text" th:field="*{phoneNumber}" class="form-control form-control-sm" placeholder="Ex : 0470123456"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Mot de passe</label>
                                <input type="password" th:field="*{password}" id="passwordInput" class="form-control form-control-sm" placeholder="Mot de passe..."/>
                            </div>

                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label small fw-semibold">Code postal</label>
                                    <input type="number" th:field="*{postcode}" class="form-control form-control-sm" placeholder="Ex : 5000"/>
                                </div>
                                <div class="col">
                                    <label class="form-label small fw-semibold">Boîte postale <span class="text-muted fw-normal">(facultatif)</span></label>
                                    <input type="text" th:field="*{postOfficeBox}" class="form-control form-control-sm" placeholder="Ex : 12"/>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label small fw-semibold">Localité</label>
                                    <input type="text" th:field="*{locality}" class="form-control form-control-sm" placeholder="Ex : Namur"/>
                                </div>
                                <div class="col">
                                    <label class="form-label small fw-semibold">Hameau <span class="text-muted fw-normal">(facultatif)</span></label>
                                    <input type="text" th:field="*{hamlet}" class="form-control form-control-sm" placeholder="Ex : Champion"/>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Rôle</label>
                                <select id="roleSelect" name="role" class="form-select form-select-sm">
                                    <option value="" disabled selected>-- Choisir un rôle --</option>
                                    <option value="2">Interprète</option>
                                    <option value="3">Bénéficiaire</option>
                                    <option value="1">Résa</option>
                                    <option value="4">Coordinatrice</option>
                                </select>
                            </div>

                            <div id="interpreteWorkField" class="mb-3" style="display: none;">
                                <label class="form-label small fw-semibold">Heures de travail hebdomadaires</label>
                                <input type="number" th:field="*{weeklyWorkHours}" class="form-control form-control-sm" placeholder="Ex : 38"/>
                            </div>

                            <div id="beneficiaryFields" style="display: none;">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Quota d'heures</label>
                                    <input type="number" th:field="*{hourQuota}" class="form-control form-control-sm" placeholder="Ex : 10"/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Niveau d'études</label>
                                    <input type="number" th:field="*{educationLevel}" class="form-control form-control-sm" placeholder="Ex : 1"/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Langue(s) de communication</label>
                                    <div class="d-flex flex-wrap gap-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" th:field="*{communicationLanguage}" value="LSFB" id="langLsfb"/>
                                            <label class="form-check-label small" for="langLsfb">LSFB</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" th:field="*{communicationLanguage}" value="francais_parle_complete" id="langFpc"/>
                                            <label class="form-check-label small" for="langFpc">Français parlé complété</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" th:field="*{communicationLanguage}" value="ecrit" id="langEcrit"/>
                                            <label class="form-check-label small" for="langEcrit">Écrit</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div id="resaCoordinatorWorkField" class="mb-3" style="display: none;">
                                <label class="form-label small fw-semibold">Heures de travail hebdomadaires</label>
                                <input type="number" th:field="*{weeklyWorkHours}" class="form-control form-control-sm" placeholder="Ex : 38"/>
                            </div>
                        </div>
                        <div class="modal-footer border-top justify-content-center gap-2">
                            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
                            <button type="submit" class="btn btn-primary btn-sm">
                                <i class="bi bi-plus-lg me-1"></i> Ajouter
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div th:replace="~{common/footer :: footer}"></div>

        <script th:src="@{/js/coordinatrice/utilisateurs.js}"></script>
        
    </body>
</html>
