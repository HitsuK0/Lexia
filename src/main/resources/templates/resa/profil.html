<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../static/css/lexia.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <meta charset="UTF-8">
    <title>Gestion d'Etablissemenet</title>
    <link rel="icon" type="image/png" href="../../static/images/logo_lexia.png">
</head>
<!--<!DOCTYPE html>    à mettre lorsque thymeleaf-->
<!--<html xmlns:th="http://www.thymeleaf.org" lang="fr">-->

<body>
<!--<script src="/js/bootstrap.bundle.min.js"></script>-->
<script src="../../static/js/bootstrap.bundle.min.js"></script>

<div th:replace="~{common/head :: head('Mon Profil')}"></div>
<div th:replace="~{common/navbar :: navbar('accueil', 'COORDINATOR', 'Vanderheyden Quentin')}"></div>

<div class="my-4 text-center ">
    <p class="h1 text-primary py-2 fw-bold">
        MonProfil
    </p>
    <p class="text-secondary">
        Gérez vos informations personnelles et vos compétences
    </p>
</div>

<div class="d-flex justify-content-center align-items-center">
<div class="card rounded-3 w-75">
    <div class="row">
        <div class="col-3 border-end p-3">
            <ul class="nav flex-column p-4">
                <li class="nav-item mb-3">
                    <a class="nav-link active fw-bold" href="#">Information personnelles</a>
                </li>
                <li class="nav-item mb-3">
                    <a class="nav-link" href="#">Compétences métiers</a>
                </li>
                <li class="nav-item mb-3">
                    <a class="nav-link" href="#">Compétences académiques</a>
                </li>
                <li class="nav-item mb-3">
                    <a class="nav-link" href="#">Compte</a>
                </li>
            </ul>
        </div>
        <div class="col-9 p-4 ">
            <form method="POST" enctype="multipart/form-data">
                <div class="row">
                    <div class="mb-3 col">
                        <label class="form-label">Nom</label>
                        <input type="text" class="form-control rounded-3 w-75">
                        <i class="bi bi-pencil-square"></i>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">Prénom</label>
                        <input type="text" class="form-control rounded-3 w-75">
                        <i class="bi bi-pencil-square"></i>
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">Date de Naissance</label>
                        <div class="row">
                            <div class="col">
                                <input type="number" class="form-control rounded-3">
                            </div>
                            <div class="col">
                                <input type="number" class="form-control rounded-3">
                            </div>
                            <div class="col">
                                <input type="number" class="form-control rounded-3">
                            </div>
                        </div>
                        <i class="bi bi-pencil-square"></i>
                    </div>

                </div>
                <div class="mb-3">
                    <p>Genre</p>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
                        <label class="form-check-label" for="inlineRadio1">Homme</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
                        <label class="form-check-label" for="inlineRadio2">Femme</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3" value="option3">
                        <label class="form-check-label" for="inlineRadio3">Non renseigné</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Diplômes</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                </div>
                <p class="h5">Coordonnées</p>
                <div class="row">
                    <div class="mb-3 col">
                        <label class="form-label">Numero Téléphone</label>
                        <input type="text" class="form-control rounded-3">
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">Adresse e-mail</label>
                        <input type="text" class="form-control rounded-3">
                    </div>
                </div>
                <p>Adresse</p>
                <div class="row">
                    <div class="mb-3 col">
                        <label class="form-label">Rue et numéro</label>
                        <input type="text" class="form-control rounded-3">
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">Code Postal</label>
                        <input type="text" class="form-control rounded-3">
                    </div>
                    <div class="mb-3 col">
                        <label class="form-label">Ville</label>
                        <input type="text" class="form-control rounded-3">
                    </div>
                </div>
                <button class="btn btn-primary rounded-3">Sauvegarder</button>
            </form>
        </div>
    </div>
</div>
</div>
    <div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
