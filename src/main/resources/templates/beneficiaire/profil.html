<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

    <head th:replace="~{common/head :: head('Mon Profil', '/css/interprete/profil.css')}"></head>

    <body>
        <nav th:replace="~{common/navbar :: navbar(activeTab='profil', userRole=${userRole}, userName=${userName}, breadcrumb=null, isAdmin=${isAdmin})}"></nav>

        <div class="container-fluid py-4">

            <div class="text-center mb-4">
                <h1 class="fw-bold text-primary">Mon Profil</h1>
                <p class="text-muted fst-italic">Gérez vos informations personnelles</p>
            </div>

            <div class="profil-wrapper mx-auto">
                <div class="row g-0">

                    <div class="col-auto profil-sidebar">
                        <p class="sidebar-title">A propos</p>
                        <ul class="sidebar-nav">
                            <li><a href="#" class="sidebar-link active" data-section="infos">Informations personnelles</a></li>
                            <li><a href="#" class="sidebar-link" data-section="account">Compte</a></li>
                        </ul>
                    </div>

                    <div class="col profil-content">

                        <div id="section-infos" class="profil-section active">

                            <div class="row mb-4">
                                <div class="col-md-3">
                                    <label class="form-label small fw-semibold">Nom</label>
                                    <div class="input-edit-group">
                                        <input type="text" class="form-control form-control-sm" value="Dupont" readonly
                                               id="inputNom"/>
                                        <button class="btn-edit" onclick="toggleEdit('inputNom', this)" title="Modifier">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-semibold">Prénom</label>
                                    <div class="input-edit-group">
                                        <input type="text" class="form-control form-control-sm" value="Jean" readonly
                                               id="inputPrenom"/>
                                        <button class="btn-edit" onclick="toggleEdit('inputPrenom', this)" title="Modifier">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">Date de Naissance</label>
                                    <div class="input-edit-group">
                                        <input type="date" class="form-control form-control-sm" value="2003-12-10" readonly id="inputDateNaissance"/>
                                        <button class="btn-edit" onclick="toggleEdit('inputDateNaissance', this)" title="Modifier"><i class="bi bi-pencil"></i></button>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Genre</label>
                                <div class="d-flex gap-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="genre" id="genreHomme" value="homme" checked/>
                                        <label class="form-check-label small" for="genreHomme">Homme</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="genre" id="genreFemme" value="femme"/>
                                        <label class="form-check-label small" for="genreFemme">Femme</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="genre" id="genreNR" value="nr"/>
                                        <label class="form-check-label small" for="genreNR">Non renseigné</label>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Diplômes</label>
                                <div class="input-edit-group align-items-start">
                                    <textarea class="form-control form-control-sm" rows="3" readonly id="inputDiplomes">Diplôme lié au métier</textarea>
                                    <button class="btn-edit mt-1" onclick="toggleEdit('inputDiplomes', this)" title="Modifier">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                </div>
                            </div>

                            <h6 class="fw-bold mb-3 mt-2">Coordonnées</h6>

                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">Numéro Téléphone</label>
                                    <div class="input-edit-group">
                                        <input type="text" class="form-control form-control-sm" value="0476 80 31 15"
                                               readonly id="inputTel"/>
                                        <button class="btn-edit" onclick="toggleEdit('inputTel', this)" title="Modifier">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </div>
                                    <div id="phoneError" style="display:none; color:#dc3545; font-size:0.875em;">
                                        Numéro de téléphone invalide. (ex: 0476791845)
                                    </div>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label small fw-semibold">Adresse e-mail</label>
                                    <div class="input-edit-group">
                                        <input type="email" class="form-control form-control-sm"
                                               value="dupontjean03@gmail.com" readonly id="inputEmail"/>
                                        <button class="btn-edit" onclick="toggleEdit('inputEmail', this)" title="Modifier">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </div>
                                    <div id="emailError" style="display:none; color:#dc3545; font-size:0.875em;">
                                        Adresse e-mail invalide. (ex: jean.dupont@gmail.com)
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Adresse</label>
                                <div class="row g-2">
                                    <div class="col-md-5">
                                        <label class="form-label" style="font-size:0.75rem; color:#888;">Rue et numéro</label>
                                        <div class="input-edit-group">
                                            <input type="text" class="form-control form-control-sm"
                                                   value="Rue de la victoire, 3" readonly id="inputRue"/>
                                            <button class="btn-edit" onclick="toggleEdit('inputRue', this)" title="Modifier">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label" style="font-size:0.75rem; color:#888;">Code Postal</label>
                                        <div class="input-edit-group">
                                            <input type="text" class="form-control form-control-sm" value="1000" readonly
                                                   id="inputCP"/>
                                            <button class="btn-edit" onclick="toggleEdit('inputCP', this)" title="Modifier">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label" style="font-size:0.75rem; color:#888;">Ville</label>
                                        <div class="input-edit-group">
                                            <input type="text" class="form-control form-control-sm" value="Bruxelles" readonly
                                                   id="inputVille"/>
                                            <button class="btn-edit" onclick="toggleEdit('inputVille', this)" title="Modifier">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div id="section-account" class="profil-section">
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Identifiant</label>
                                <input type="text" class="form-control form-control-sm" value="B01" readonly
                                       style="max-width:220px"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Mot de Passe</label>
                                <div class="input-edit-group">
                                    <input type="password" class="form-control form-control-sm" value="motdepasse123" readonly
                                           style="max-width:220px"/>
                                    <button class="btn-edit" data-bs-toggle="modal" data-bs-target="#modalPassword" title="Modifier">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end mt-4 pt-2 border-top">
                            <button class="btn btn-primary btn-sm px-4">
                                Sauvegarder <i class="bi bi-floppy"></i>
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>


        <div class="modal fade" id="modalPassword" tabindex="-1" aria-labelledby="modalPasswordLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content modal-rounded">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold w-100 text-center" id="modalPasswordLabel">Modifier le mot de passe</h5>
                        <button type="button" class="btn-close position-absolute end-0 me-3" data-bs-dismiss="modal"></button>
                    </div>
                    <hr class="mx-3 mt-2"/>
                    <div class="modal-body px-4">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Ancien mot de passe</label>
                            <input type="password" class="form-control form-control-sm" id="inputOldPassword"
                                   placeholder="Entrez l'ancien mot de passe ..."/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Nouveau mot de passe</label>
                            <input type="password" class="form-control form-control-sm" id="inputNewPassword"
                                   placeholder="Entrez le nouveau mot de passe ..."/>
                            <div id="passwordError" style="display:none; color:#dc3545; font-size:0.875em;"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Confirmer le mot de passe</label>
                            <input type="password" class="form-control form-control-sm" id="inputConfirmPassword"
                                   placeholder="Confirmation ..."/>
                            <div id="confirmError" style="display:none; color:#dc3545; font-size:0.875em;">
                                Les mots de passe ne correspondent pas.
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 justify-content-center">
                        <button type="button" class="btn btn-primary btn-sm px-5" onclick="savePassword()">Sauvegarder</button>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{common/footer :: footer}"></div>

        <script>
            /* Handles sidebar navigation: on click, removes 'active' from all links and sections,
            then sets the clicked link and its corresponding section as active. */
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
                    document.querySelectorAll('.profil-section').forEach(s => s.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById('section-' + this.dataset.section).classList.add('active');
                });
            });

            /* Allows you to check the email format before saving */
            function isValidEmail(email) {
                const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return regex.test(email);
            }

            /* Allows you to check the phone number format before saving */
            function isValidPhone(phone) {
                const regex = /^[0-9\s]{7,15}$/;
                return regex.test(phone);
            }

            /* Toggles a form field between readonly and editable mode,
            and updates the edit button color to indicate the current state. */
            function toggleEdit(id, btn) {
                const input = document.getElementById(id);
                const isReadonly = input.hasAttribute('readonly');
                if (isReadonly) {
                    input.removeAttribute('readonly');
                    input.focus();
                    btn.style.color = '#593196';
                } else {
                    if (id === 'inputEmail' && !isValidEmail(input.value)) {
                        input.classList.add('is-invalid');
                        document.getElementById('emailError').style.display = 'block';
                        return;
                    }
                    if (id === 'inputTel' && !isValidPhone(input.value)) {
                        input.classList.add('is-invalid');
                        document.getElementById('phoneError').style.display = 'block';
                        return;
                    }
                    document.getElementById('emailError').style.display = 'none';
                    document.getElementById('phoneError').style.display = 'none';
                    input.classList.remove('is-invalid');
                    input.setAttribute('readonly', true);
                    btn.style.color = '';
                }
            }


            /* Verifies that the password contains at least 8 characters, one uppercase,
            one lowercase, one number, and a special character.*/
            function isValidPassword(password) {
                const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;
                return regex.test(password);
            }

            /* Validates the new password and its confirmation before closing the modal,
             otherwise displays the corresponding errors. */
            function savePassword() {
                const newPassword = document.getElementById('inputNewPassword').value;
                const confirmPassword = document.getElementById('inputConfirmPassword').value;
                const passwordError = document.getElementById('passwordError');
                const confirmError = document.getElementById('confirmError');

                passwordError.style.display = 'none';
                confirmError.style.display = 'none';

                if (!isValidPassword(newPassword)) {
                    passwordError.innerHTML = 'Le mot de passe doit contenir au minimum :<br>' +
                        '- 8 caractères<br>' +
                        '- 1 majuscule<br>' +
                        '- 1 chiffre<br>' +
                        '- 1 caractère spécial (!@#$%...)';
                    passwordError.style.display = 'block';
                    return;
                }

                if (newPassword !== confirmPassword) {
                    confirmError.style.display = 'block';
                    return;
                }

                bootstrap.Modal.getInstance(document.getElementById('modalPassword')).hide();
            }
        </script>
    </body>
</html>
